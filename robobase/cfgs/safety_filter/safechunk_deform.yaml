# @package _global_

safety_filter:
  enabled: true
  _target_: robobase.safetyfilter.safechunk_deform_filter.SafeChunkDeformFilter
  _recursive_: false

  horizon: 16
  dt: 0.05
  action_dim: 16
  expected_motion_dim: 14
  control_type: absolute
  debug: true

  controlled_action_indices: [4, 5, 6, 7, 9, 10, 11, 12]
  controlled_state_indices: [4, 5, 6, 7, 9, 10, 11, 12]

  min_clearance: 0.12
  brake_progress_threshold: 0.05
  deadlock_window: 5
  deformation_enabled: true
  mode: candidate
  chunk_deformation_scales: [0.0, 0.25, 0.5, 0.75]
  chunk_deformation_smoothing: 1
  sequential_oscbf_fallback: false
  deform_after_deadlock_window: true
  unsafe_deformation_fallback: brake
  opt_iters: 20
  opt_lr: 0.03
  lambda_safety: 500.0
  lambda_action: 0.1
  lambda_path: 0.2
  lambda_smooth: 0.1
  optimized_fallback: candidate
  detach_passthrough_dims: true
  recoverable_deform:
    enabled: true
    lambda_rejoin: 0.5
    rejoin_threshold: 0.03
    inner_rejoin_metric: q_state
    final_rejoin_metric: q_state
    cache_nominal_ee: false
    ee_rejoin_in_inner_loop: false
    q_rejoin_threshold: 0.5
    ee_rejoin_threshold: 0.08
    explicit_return: true
    acceptance_clearance_tol: 0.005
    lambda_yield_safety: 800.0
    lambda_yield_action: 0.1
    lambda_yield_smooth: 0.1
    lambda_retreat: 1.0
    lambda_return_safety: 500.0
    lambda_return_rejoin: 5.0
    lambda_return_smooth: 0.2
    lambda_return_action: 0.1
    yield_horizon: 4
    return_horizon: 8
    max_return_retries: 3
    use_ee_final_check: false
    min_rejoin_offset: 2
    use_ee_pose_rejoin: false
    use_object_state_rejoin: false
    brake_if_unrecoverable: true
  optimized_deform:
    debug_safety_feasibility: true
  explicit_recovery:
    commit_accepted_chunks: true
    committed_chunk_safety_check: true
    committed_safety_tol: 0.005
    committed_abort_only_if_contact_risk: true
    committed_min_clearance_for_abort: 0.08
    repair_committed_action: true
    monotonic_committed_repair: true
    committed_execution_margin: 0.02
    committed_state_error_threshold: 0.25
    committed_state_error_action: "replan"
    committed_state_mismatch_abort_requires_unsafe: false
  safechunk_recovery_corridor:
    enabled: true
    require_recover_path_safe: true
    recover_path_min_clearance: 0.04
    recover_immediate_hard_clearance: 0.02
    recover_prefix_min_clearance: 0.04
    enable_direct_rejoin: true
    enable_detour_rejoin: true
    enable_delayed_rejoin: true
    suppress_repeated_unsafe_recovery: true
    unsafe_recovery_cooldown_steps: 8
    max_same_target_failures: 2
    detour_scales: [0.25, 0.5, 0.75, 1.0]
    detour_clearance_weight: 100.0
    detour_task_rejoin_weight: 10.0
    detour_action_norm_weight: 0.2
    delayed_rejoin_wait_steps: 4
    delayed_rejoin_requires_nominal_prefix_safe: true
    require_safe_corridor_for_recovery_complete: true
    require_post_recovery_act_window: true
    post_recovery_min_act_steps: 5
  diagnostics:
    enabled: true
    large_arm_delta_threshold: 3.0
    large_base_delta_threshold: 0.5
    low_act_ratio_threshold: 0.3
    high_fallback_ratio_threshold: 0.5
  opt_population: 32
  opt_elite_frac: 0.25
  opt_seed: 0

  oscbf_operator:
    _target_: robobase.safetyfilter.oscbf.oscbffilter.OSCBFFilter
    urdf_path: null
    debug: true
    use_dummy_filter: false
    expected_motion_dim: 14
    dt: 0.05
    human_margin: 0.08
    alpha_gain: 10.0
    control_type: absolute
