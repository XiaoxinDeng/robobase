# @package _global_

extends:
  - temporal_human_blocker.yaml
  - methods/safechunk_deform.yaml

scenario:
  name: temporal_human_blocker_trajectory_short_lateral_chunk_deform
  description: >-
    Short lateral sweep across the robot approach path; it blocks early without occupying the drawer-handle workspace for long.

hydra:
  run:
    dir: eval_safety/${scenario.name}_${now:%Y%m%d_%H%M%S}

safety_filter:
  overrides:
    temporary_blocker:
      enabled: true

environment:
  override:
    - +env.enable_temporary_human_blocker=true
    - +env.trigger_dist=1.10
    - +env.enter_duration=0.90
    - +env.hold_duration=0.80
    - +env.exit_duration=0.90
    - +env.natural_motion_scale=0.70
    - +env.q_outside=[0.06,-0.31,0.0,0.0,-0.35,1.20]
    - +env.q_block=[0.42,0.25,0.0,1.57,-0.42,0.95]
    - +env.q_exit=null

eval_args:
  condition: chunk_deform
  episodes: 10
  steps: 300
  seed: 1
  continue_after_success: true
  no_progress: true
  log_chunk_trajectories: true
  log_mpc_replay_diagnostics: true
  mpc_replay_diagnostics_max_events: 300
  plot_chunk_trajectories_3d: true
  video_time_base: sim
  stop_video_at_steps: 300
  reset_action_history_after_human_exit: true
  reset_visual_history_after_human_exit: true

launch_example: >-
  cd /home/xd1125/Workspace/safe_bigym_hoi/external/robobase && \
  TF_CPP_MIN_LOG_LEVEL=2 /home/xd1125/miniconda3/envs/safe_bigym_hoi/bin/python \
    eval_act_oscbf_safety_metrics.py \
    --eval-config robobase/cfgs/eval_scenarios/experiments/temporal_human_blocker_trajectory_short_lateral_chunk_deform.yaml
