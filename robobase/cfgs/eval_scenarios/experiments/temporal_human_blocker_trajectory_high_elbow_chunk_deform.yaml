# @package _global_

extends:
  - temporal_human_blocker.yaml
  - methods/safechunk_deform.yaml

scenario:
  name: temporal_human_blocker_trajectory_high_elbow_chunk_deform
  description: >-
    Folded high-elbow blocker pose; changes forearm capsule orientation while still crossing the robot approach corridor.

hydra:
  run:
    dir: eval_safety/${scenario.name}_${now:%Y%m%d_%H%M%S}

safety_filter:
  overrides:
    temporary_blocker:
      enabled: true

environment:
  override:
    - +env.enable_temporary_human_blocker=true
    - +env.trigger_dist=1.20
    - +env.enter_duration=1.25
    - +env.hold_duration=1.10
    - +env.exit_duration=1.15
    - +env.natural_motion_scale=1.10
    - +env.q_outside=[-0.65,-0.26,0.0,0.0,-0.35,1.20]
    - +env.q_block=[0.46,0.28,0.0,1.35,-0.75,1.55]
    - +env.q_exit=null

eval_args:
  condition: chunk_deform
  episodes: 10
  steps: 300
  seed: 1
  continue_after_success: true
  no_progress: true
  log_chunk_trajectories: true
  log_mpc_replay_diagnostics: true
  mpc_replay_diagnostics_max_events: 300
  plot_chunk_trajectories_3d: true
  video_time_base: sim
  stop_video_at_steps: 300
  reset_action_history_after_human_exit: true
  reset_visual_history_after_human_exit: true

launch_example: >-
  cd /home/xd1125/Workspace/safe_bigym_hoi/external/robobase && \
  TF_CPP_MIN_LOG_LEVEL=2 /home/xd1125/miniconda3/envs/safe_bigym_hoi/bin/python \
    eval_act_oscbf_safety_metrics.py \
    --eval-config robobase/cfgs/eval_scenarios/experiments/temporal_human_blocker_trajectory_high_elbow_chunk_deform.yaml
