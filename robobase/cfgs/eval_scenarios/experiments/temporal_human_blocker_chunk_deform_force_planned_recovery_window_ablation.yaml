# @package _global_

extends:
  - temporal_human_blocker_chunk_deform_force_planned_recovery_q_ablation.yaml

scenario:
  name: temporal_human_blocker_chunk_deform_force_planned_recovery_window_ablation
  description: >-
    Eval-only ablation: force the robot to the planner recovery terminal q,
    then seed ACT's stacked observation context with a 4-frame recovery-terminal
    q window before ACT resumes. This tests whether ACT fails because the
    terminal state is bad or because the four-frame temporal context is broken.

hydra:
  run:
    dir: eval_safety/${scenario.name}_${now:%Y%m%d_%H%M%S}

eval_args:
  ablation_force_planned_recovery_q_seed_policy_window: true
  ablation_force_planned_recovery_q_window_len: 4
  ablation_force_planned_recovery_q_window_interpolate: true
  ablation_force_planned_recovery_q_reset_history: false
  episodes: 2
  steps: 300

launch_example: >-
  cd /home/xd1125/Workspace/safe_bigym_hoi/external/robobase && \
  TF_CPP_MIN_LOG_LEVEL=2 /home/xd1125/miniconda3/envs/safe_bigym_hoi/bin/python \
    eval_act_oscbf_safety_metrics.py \
    --eval-config robobase/cfgs/eval_scenarios/experiments/temporal_human_blocker_chunk_deform_force_planned_recovery_window_ablation.yaml
