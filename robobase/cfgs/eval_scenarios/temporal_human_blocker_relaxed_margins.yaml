# @package _global_
#
# Temporal/temporary human-arm blocker scenario for SafeChunk-Deform evaluation.
# This is separate from default_human_arm_motion.yaml: here the clean drawer
# task is executed while a mirrored safety/video env injects the temporary
# human blocker.
#
# The current eval entrypoint is argparse-based, so this file documents a
# reusable preset and the matching CLI flags rather than being auto-loaded by
# Hydra.

scenario:
  name: temporal_human_blocker_relaxed_margins
  description: >-
    Tuned temporary human blocker with horizon-brake wait/brake before
    deformation, using relaxed h margins so brief near-margin replay does not
    abort recovery unnecessarily.

eval_args:
  env: bigym/drawer_top_open
  safety_env: bigym/human_arm_drawer_top_open
  normalization_source: eval
  hide_human_arm_policy_obs: false

  # Human arm contact/visibility mode in the safety/video env.
  enable_human_arm_collisions: true
  disable_human_arm_collisions: false
  visual_only_human_arm: false
  freeze_human_arm: false

  # Built-in TemporaryDrawerArmBlocker tuning from the arm tuner defaults.
  temporary_blocker:
    enabled: true
    trigger_dist: 1.20
    enter_duration: 1.20
    hold_duration: 1.20
    exit_duration: 1.20
    natural_scale: 1.0
    spawn_x: 0.06
    spawn_y: -0.31
    move_x: 0.00
    move_y: 0.62
    block_yaw: 1.57
    block_pitch: -0.45
    block_elbow: 1.00

  # SafeChunk-Deform settings for temporary obstruction.
  condition: chunk_deform
  chunk_deform_mode: optimized
  chunk_recoverable_deform_enabled: true
  chunk_explicit_return: true
  chunk_commit_accepted_chunks: true
  chunk_allow_candidate_fallback: false
  chunk_optimized_fallback: brake

  # For temporary blockers, wait/brake first; deform only after persistence.
  chunk_temporary_blocker_enabled: true
  chunk_temporary_prefer_brake_before_deform: true
  chunk_temporary_min_unsafe_steps_before_deform: 8
  chunk_temporary_max_brake_steps_before_deform: 12
  chunk_temporary_reset_on_nominal_safe: true
  chunk_temporary_require_progress_deadlock_before_deform: true
  chunk_temporary_progress_window: 10
  chunk_temporary_min_progress_delta: 0.001
  chunk_temporary_recover_after_wait: false

  # Relaxed but still conservative h margins for blocker replay.
  chunk_min_clearance: 0.08
  chunk_committed_min_clearance_for_abort: 0.05
  chunk_committed_execution_margin: 0.02
  chunk_recover_path_min_clearance: 0.04
  chunk_recover_immediate_hard_clearance: 0.02
  chunk_recover_prefix_min_clearance: 0.04

  # Optimizer defaults; JAX batched acceleration is default-on in code.
  chunk_opt_iters: 20
  chunk_opt_population: 32
  chunk_opt_lr: 0.03
  chunk_lambda_safety: 500.0
  chunk_lambda_action: 0.1
  chunk_lambda_path: 0.2
  chunk_lambda_smooth: 0.1
  chunk_lambda_rejoin: 0.5
  chunk_inner_rejoin_metric: q_state
  chunk_final_rejoin_metric: q_state
  chunk_q_rejoin_threshold: 0.5

  # Horizon human prediction.
  chunk_horizon_predict_human_motion: true
  chunk_human_motion_prediction_max_time: 0.25
  chunk_human_motion_prediction_max_speed: 3.0

cli_overrides:
  - --env bigym/drawer_top_open
  - --safety-env bigym/human_arm_drawer_top_open
  - --normalization-source eval
  - --enable-human-arm-collisions
  - --chunk-deform-mode optimized
  - --chunk-temporary-blocker-enabled
  - --chunk-temporary-prefer-brake-before-deform
  - --chunk-temporary-min-unsafe-steps-before-deform 8
  - --chunk-temporary-max-brake-steps-before-deform 12
  - --chunk-min-clearance 0.08
  - --chunk-committed-min-clearance-for-abort 0.05
  - --chunk-optimized-fallback brake
  - --no-chunk-allow-candidate-fallback
  - --override +env.enable_temporary_human_blocker=true
  - --override +env.trigger_dist=1.20
  - --override +env.enter_duration=1.20
  - --override +env.hold_duration=1.20
  - --override +env.exit_duration=1.20
  - --override +env.natural_scale=1.0
  - --override +env.spawn_x=0.06
  - --override +env.spawn_y=-0.31
  - --override +env.move_x=0.00
  - --override +env.move_y=0.62
  - --override +env.block_yaw=1.57
  - --override +env.block_pitch=-0.45
  - --override +env.block_elbow=1.00
