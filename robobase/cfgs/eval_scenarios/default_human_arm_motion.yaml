# @package _global_
#
# Default BiGym human-arm motion scenario for SafeChunk-Deform evaluation.
# This is intentionally separate from temporary-blocker configs: it uses the
# normal human_arm_drawer_top_open scripted arm, without forced carrier XY,
# transient obstruction, drawer obstruction, EE-side sweep, or natural-contact
# override.
#
# The current eval entrypoint is argparse-based, so this file documents a
# reusable preset and the matching CLI flags rather than being auto-loaded by
# Hydra.

scenario:
  name: default_human_arm_motion
  description: >-
    Default moving human arm in bigym/human_arm_drawer_top_open with physical
    collisions enabled. Use this when evaluating normal human-arm motion, not
    the tuned temporal/temporary blocker scenario.

eval_args:
  env: bigym/human_arm_drawer_top_open
  safety_env: null
  normalization_source: auto
  hide_human_arm_policy_obs: false

  # Human arm contact/visibility mode.
  enable_human_arm_collisions: true
  disable_human_arm_collisions: false
  visual_only_human_arm: false
  freeze_human_arm: false

  # Default scripted human-arm motion.
  human_arm_aggression: 1.0
  human_arm_substeps: 1
  human_arm_zero_dwell: false
  human_arm_walk_radius: null
  human_arm_goal_xy: null
  human_arm_keepout_min_clear: null
  human_arm_disable_keepout: false
  human_arm_yaw_offset_deg: 90.0

  # Explicitly disabled blocker/contact-test modes.
  human_arm_transient_obstruction: false
  human_arm_ee_obstruction: false
  human_arm_ee_side_sweep: false
  human_arm_drawer_obstruction: false
  human_arm_force_carrier_xy: null
  human_arm_force_carrier_amp_xy: null
  human_arm_natural_contact_motion: false
  human_arm_final_clear_after_steps: -1

  # Runtime/logging. Disable only the standalone h monitor for speed; SafeChunk
  # horizon/post-action checks and physical MuJoCo contact counting remain on.
  live_h_monitor: false

  # SafeChunk-Deform settings for default human-arm motion.
  condition: chunk_deform
  chunk_deform_mode: optimized
  chunk_recoverable_deform_enabled: true
  chunk_explicit_return: true
  chunk_commit_accepted_chunks: true
  chunk_allow_candidate_fallback: false
  chunk_optimized_fallback: brake
  chunk_temporary_blocker_enabled: false

  # Relaxed but still conservative h margins for the default moving arm.
  # Previous 0.12/0.08 settings were safe but caused low ACT utilization and
  # many committed recovery aborts in s16_optimized_default_human_arm_180step.
  chunk_min_clearance: 0.08
  chunk_committed_min_clearance_for_abort: 0.05
  chunk_committed_execution_margin: 0.02
  chunk_recover_path_min_clearance: 0.04
  chunk_recover_immediate_hard_clearance: 0.02
  chunk_recover_prefix_min_clearance: 0.04

  # Optimizer defaults; JAX batched acceleration is default-on in code.
  chunk_opt_iters: 20
  chunk_opt_population: 32
  chunk_opt_lr: 0.03
  chunk_lambda_safety: 500.0
  chunk_lambda_action: 0.1
  chunk_lambda_path: 0.2
  chunk_lambda_smooth: 0.1
  chunk_lambda_rejoin: 0.5
  chunk_inner_rejoin_metric: q_state
  chunk_final_rejoin_metric: q_state
  chunk_q_rejoin_threshold: 0.5
  chunk_ee_rejoin_threshold: 0.08

  # Horizon human prediction.
  chunk_horizon_predict_human_motion: true
  chunk_human_motion_prediction_max_time: 0.25
  chunk_human_motion_prediction_max_speed: 3.0

cli_overrides:
  - --env bigym/human_arm_drawer_top_open
  - --enable-human-arm-collisions
  - --no-live-h-monitor
  - --chunk-deform-mode optimized
  - --no-chunk-temporary-blocker-enabled
  - --chunk-min-clearance 0.08
  - --chunk-committed-min-clearance-for-abort 0.05
  - --chunk-optimized-fallback brake
  - --no-chunk-allow-candidate-fallback


